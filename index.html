.actions{display:flex;gap:10px;margin-top:12px} .wa,.done{flex:1;text-align:center;padding:12px 10px;border-radius:10px;font-size:16px;text-decoration:none;border:0;cursor:pointer} .wa{background:#25D366;color:#06120a;font-weight:700} .done{background:#183335;color:#fff} .card.sent .done{background:#1f6f50} .card.sent .done:before{content:'✓ ';font-weight:800}
.counter{color:#d5e2e3;margin:8px 0 16px} .noresults{display:none;color:#9fb2b4;text-align:center;padding:28px 10px}
.toolbar{display:flex;gap:8px;margin-bottom:12px} .toolbtn{background:#10282a;color:#d9e7e8;border:1px solid #21494b;border-radius:10px;padding:9px 11px;font-size:13px}

const AAD=new TextEncoder().encode('sama-allubab-debts-v1');
const SENT_KEY='sama_allubab_debt_sent_web_v1', POS_KEY='sama_allubab_debt_scroll_web_v1', QUERY_KEY='sama_allubab_debt_query_web_v1', REMEMBER_KEY='sama_allubab_debt_unlock_web_v1';
let records=[];
function b64bytes(s){const b=atob(s);return Uint8Array.from(b,c=>c.charCodeAt(0));}
async function derive(pass){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64bytes(PAYLOAD.salt),iterations:PAYLOAD.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);}
async function decrypt(pass){const key=await derive(pass);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(PAYLOAD.nonce),additionalData:AAD},key,b64bytes(PAYLOAD.cipher));return JSON.parse(new TextDecoder().decode(plain));}
function normalizeArabic(s){s=(s||'').toLowerCase();try{s=s.normalize('NFKD')}catch(e){}return s.replace(/[ً-ٰٟ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ة/g,'ه').replace(/[^0-9a-z؀-ۿ]+/gi,' ').replace(/\s+/g,' ').trim();}
function getState(){try{return JSON.parse(localStorage.getItem(SENT_KEY)||'{}')}catch(e){return {}}}
function saveState(st){localStorage.setItem(SENT_KEY,JSON.stringify(st)); updateCounts();}
function waUrl(r){return 'https://wa.me/'+encodeURIComponent(r.wa_phone)+'?text='+encodeURIComponent(r.message);}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){const state=getState(), box=document.getElementById('cards');box.innerHTML=records.map((r,i)=>`<div class="card ${state[r.id]?'sent':''}" data-id="${esc(r.id)}" data-search="${esc(r.name+' '+r.phone)}"><div class="topline"><span class="num">${i+1}</span><strong>${esc(r.name)}</strong></div><div class="amount">${esc(r.amount)}</div>${r.usd?`<div class="usd">${esc(r.usd)}</div>`:''}<div class="phone">${esc(r.phone)}</div><div class="actions"><a class="wa" href="${waUrl(r)}" target="_blank" rel="noopener">فتح واتساب</a><button class="done" type="button">${state[r.id]?'تم':'تم الإرسال'}</button></div></div>`).join('');
 box.querySelectorAll('.card').forEach(c=>{c.querySelector('.done').addEventListener('click',()=>toggle(c));c.querySelector('.wa').addEventListener('click',()=>remember());});filterCards();}
function toggle(card){const state=getState(), id=card.dataset.id;state[id]=!state[id];if(!state[id])delete state[id];card.classList.toggle('sent',!!state[id]);card.querySelector('.done').textContent=state[id]?'تم':'تم الإرسال';saveState(state);}
function updateCounts(){const state=getState(), cards=[...document.querySelectorAll('.card')],sent=cards.filter(c=>state[c.dataset.id]).length,shown=cards.filter(c=>c.style.display!=='none').length;document.getElementById('sentCount').textContent='تم الإرسال: '+sent;document.getElementById('leftCount').textContent='الباقي: '+(cards.length-sent);document.getElementById('shownCount').textContent='المعروض: '+shown;document.getElementById('counter').textContent='المعروض: '+shown+' من '+cards.length;document.getElementById('noresults').style.display=shown?'none':'block';}
function filterCards(){const q=normalizeArabic(document.getElementById('q').value),parts=q?q.split(' '):[];document.querySelectorAll('.card').forEach(c=>{const h=normalizeArabic(c.dataset.search);c.style.display=parts.every(p=>h.includes(p))?'':'none';});localStorage.setItem(QUERY_KEY,document.getElementById('q').value);updateCounts();}
function remember(){localStorage.setItem(POS_KEY,String(scrollY||0));localStorage.setItem(QUERY_KEY,document.getElementById('q').value||'');}
async function unlock(pass,remember){const err=document.getElementById('err');err.textContent='';try{records=await decrypt(pass);if(remember)localStorage.setItem(REMEMBER_KEY,pass);else localStorage.removeItem(REMEMBER_KEY);document.getElementById('lockScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('q').value=localStorage.getItem(QUERY_KEY)||'';render();const y=parseInt(localStorage.getItem(POS_KEY)||'0',10);if(y)setTimeout(()=>scrollTo(0,y),60);}catch(e){err.textContent='رمز الدخول غير صحيح.';}}
document.getElementById('unlockBtn').addEventListener('click',()=>unlock(document.getElementById('pass').value,document.getElementById('remember').checked));
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('unlockBtn').click();});
document.getElementById('q').addEventListener('input',filterCards);
document.getElementById('clearSearch').addEventListener('click',()=>{document.getElementById('q').value='';filterCards();document.getElementById('q').focus();});
document.getElementById('lockBtn').addEventListener('click',()=>{localStorage.removeItem(REMEMBER_KEY);location.reload();});
addEventListener('scroll',()=>localStorage.setItem(POS_KEY,String(scrollY||0)),{passive:true});addEventListener('pagehide',remember);
const remembered=localStorage.getItem(REMEMBER_KEY);if(remembered)unlock(remembered,true);
</script>
</body></html>
